[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melody"
version = "0.1.0"
description = "Code reviewer/auditor for AI-generated code. Findings carry evidence, never opinion."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
melody = "cli:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["cli", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
